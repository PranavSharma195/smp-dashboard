{% load smp %}
<div class="thumb tone-{{ p.tone }}">
  {% if p.image %}<img src="{{ p.image.url }}" alt="{{ p.name }}" loading="lazy">{% else %}
  <svg class="thumb-art" viewBox="0 0 200 125" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <circle cx="{% widthratio p.tone 5 150 %}" cy="22" r="46" class="art-ring"/>
    <circle cx="30" cy="110" r="58"/><circle cx="178" cy="98" r="34"/>
    <path d="M0 96 C40 70 80 120 120 90 S180 70 200 84 V125 H0Z"/>
  </svg>
  <span class="thumb-icon">{% icon p.category.icon "icon icon-xl" %}</span>{% endif %}
</div>
